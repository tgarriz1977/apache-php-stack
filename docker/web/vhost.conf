# HTTP vhost (contenedor) — mirror del branch "LE deshabilitado" de
# roles/apache/templates/http-vhost.j2. Sirve el docroot directamente, sin
# redirect a HTTPS (no hay Let's Encrypt en docker).
# PHP se proxy-ee a php-fpm por TCP (entre contenedores no hay socket unix).
<VirtualHost *:80>
    # ${DOMAIN} se resuelve con mod_envvar; compose lo define siempre
    # (default: example.com). ServerAlias * => responde a cualquier hostname.
    ServerName ${DOMAIN}
    ServerAlias *

    DocumentRoot /var/www/html

    <Directory "/var/www/html">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    DirectoryIndex index.php index.html index.htm

    # Entre contenedores no hay socket unix, así que PHP-FPM se alcanza por
    # TCP. La sintaxis proxy:fcgi://<host>:<puerto> conecta directamente a
    # PHP-FPM. (La variante "proxy:tcp://...|fcgi://localhost" del rol apache
    # es para el socket unix del mismo host y NO sirve para TCP: Apache la
    # interpreta como una conexión a "localhost", no a php-fpm.)
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://php-fpm:9000"
    </FilesMatch>
</VirtualHost>
